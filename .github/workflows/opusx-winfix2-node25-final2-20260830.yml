name: OPUS-X winfix2 final2 Windows Node 25.8.1 validation

on:
  push:
    branches:
      - ci/opusx-winfix2-node25-20260830
    paths:
      - '.github/workflows/opusx-winfix2-node25-final2-20260830.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PAYLOAD_DIR: tmp/opusx-winfix2
  EVIDENCE_DIR: tmp/opusx-winfix2/results-final2

jobs:
  windows-node25-winfix2:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/opusx-winfix2-node25-20260830
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 25.8.1

      - name: Reopen exact winfix2 payload in a spaced Windows path and run gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $evidence = Join-Path $workspace $env:EVIDENCE_DIR
          Remove-Item $evidence -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          $headParts = 0..6 | ForEach-Object { Join-Path $workspace ("tmp\opusx-winfix2\project.part.{0:D2}" -f $_) }
          $tailParts = 0..6 | ForEach-Object { Join-Path $workspace ("tmp\opusx-winfix2\tail.seg.{0:D2}" -f $_) }
          $orderedParts = @($headParts + $tailParts)
          foreach ($part in $orderedParts) {
            if (-not (Test-Path $part)) { throw "Missing payload segment: $part" }
          }
          $payloadBase64 = ($orderedParts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          $payloadArchive = Join-Path $env:RUNNER_TEMP 'opusx-winfix2-project.tar.gz'
          [IO.File]::WriteAllBytes($payloadArchive, [Convert]::FromBase64String($payloadBase64))
          $payloadHash = (Get-FileHash $payloadArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($payloadHash -ne 'dd8ca8d6e9649dc973563316b57fbab939ac28a2b8e326817276f69b6acd9675') {
            throw "Payload SHA-256 mismatch: $payloadHash"
          }

          $project = Join-Path $env:RUNNER_TEMP 'opusx-winfix2-source'
          Remove-Item $project -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          & tar.exe -xzf $payloadArchive -C $project
          if ($LASTEXITCODE -ne 0) { throw "Project extraction failed: $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $project 'package.json'))) { throw 'Project package.json is missing.' }

          $tsStage = Join-Path $env:RUNNER_TEMP 'typescript-5.8.3-stage'
          Remove-Item $tsStage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tsStage | Out-Null
          Push-Location $tsStage
          try {
            & npm.cmd init -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "npm init failed: $LASTEXITCODE" }
            & npm.cmd install typescript@5.8.3 --no-audit --no-fund --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw "TypeScript install failed: $LASTEXITCODE" }
          } finally { Pop-Location }
          $vendorTs = Join-Path $project 'vendor\typescript'
          New-Item -ItemType Directory -Force -Path (Split-Path $vendorTs -Parent) | Out-Null
          Copy-Item (Join-Path $tsStage 'node_modules\typescript') $vendorTs -Recurse -Force
          if (-not (Test-Path (Join-Path $vendorTs 'lib\typescript.js'))) { throw 'vendor/typescript/lib/typescript.js is missing.' }

          $moduleSpecifier = Get-Content (Join-Path $project 'scripts\lib\module-specifier.mjs') -Raw
          $loader = Get-Content (Join-Path $project 'scripts\lib\load-typescript.mjs') -Raw
          $buildScript = Get-Content (Join-Path $project 'scripts\build.mjs') -Raw
          $typecheckScript = Get-Content (Join-Path $project 'scripts\typecheck.mjs') -Raw
          $serveScript = Get-Content (Join-Path $project 'scripts\serve.mjs') -Raw
          if ($moduleSpecifier -notmatch 'pathToFileURL') { throw 'pathToFileURL is absent.' }
          if ($loader -notmatch 'importModule' -or $loader -notmatch 'normalizeImportSpecifier') { throw 'TypeScript loader is not URL-normalized.' }
          if ($buildScript -notmatch 'loadTypeScript' -or $typecheckScript -notmatch 'loadTypeScript') { throw 'Build/typecheck do not use the normalized loader.' }
          if ($serveScript -notmatch 'lastIndexOf') { throw 'Final --port override is not honored.' }
          $rawImport = Get-ChildItem (Join-Path $project 'scripts') -Recurse -File -Include *.mjs,*.js,*.cjs |
            Select-String -Pattern 'import\(\s*(?:path\.)?(?:join|resolve)\s*\(' -AllMatches
          if ($rawImport) { throw "Raw filesystem dynamic import remains: $($rawImport.Path -join ', ')" }

          $externalParent = Join-Path $env:RUNNER_TEMP 'New Windows External Reopen With Spaces'
          $external = Join-Path $externalParent 'OPUS X TX360 winfix2 Node 25.8.1'
          Remove-Item $externalParent -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $external | Out-Null
          & robocopy.exe $project $external /MIR /XD node_modules dist dist-lib .git /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed: $LASTEXITCODE" }

          $result = [ordered]@{
            node = (& node.exe --version).Trim()
            npm = (& npm.cmd --version).Trim()
            runner_os = $env:RUNNER_OS
            image_os = $env:ImageOS
            external_folder = $external
            source_commit = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            payload_sha256 = $payloadHash
            gates = @()
          }
          if ($result.node -ne 'v25.8.1') { throw "Unexpected Node version: $($result.node)" }

          function Run-Gate([string]$Name, [string]$CommandLine) {
            $logPath = Join-Path $evidence ($Name + '.log')
            $started = Get-Date
            & cmd.exe /d /s /c $CommandLine 2>&1 | Tee-Object -FilePath $logPath
            $exit = $LASTEXITCODE
            $result.gates += [ordered]@{
              name = $Name
              command = $CommandLine
              exit_code = $exit
              duration_seconds = [math]::Round(((Get-Date) - $started).TotalSeconds, 3)
              log = [IO.Path]::GetFileName($logPath)
            }
            if ($exit -ne 0) { throw "$Name failed with exit code $exit" }
          }

          Push-Location $external
          try {
            Run-Gate '01-ci' 'npm.cmd ci --no-audit --no-fund'
            Run-Gate '02-windows-esm-contract' 'npm.cmd run test:windows-esm'
            Run-Gate '03-typecheck' 'npm.cmd run typecheck'
            Run-Gate '04-lint' 'npm.cmd run lint'
            Run-Gate '05-test' 'npm.cmd run test'
            Run-Gate '06-build' 'npm.cmd run build'

            $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
            $listener.Start(); $port = $listener.LocalEndpoint.Port; $listener.Stop()
            $stdout = Join-Path $evidence '07-dev.stdout.log'
            $stderr = Join-Path $evidence '07-dev.stderr.log'
            $devStarted = Get-Date
            $dev = Start-Process -FilePath 'cmd.exe' -ArgumentList @('/d','/s','/c',"npm.cmd run dev -- --host 127.0.0.1 --port $port") -WorkingDirectory $external -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            try {
              $response = $null
              for ($i = 0; $i -lt 180; $i++) {
                Start-Sleep -Milliseconds 500
                try {
                  $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/" -TimeoutSec 2
                  if ($response.StatusCode -eq 200 -and $response.Content -match 'id="root"') { break }
                } catch { $response = $null }
                if ($dev.HasExited) { break }
              }
              if (-not $response -or $response.StatusCode -ne 200) { throw 'Dev server did not return HTTP 200.' }

              $browserPaths = @(
                "$env:ProgramFiles(x86)\Microsoft\Edge\Application\msedge.exe",
                "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
                "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
                "$env:ProgramFiles(x86)\Google\Chrome\Application\chrome.exe"
              )
              $browser = $browserPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
              if (-not $browser) { throw 'No Edge/Chrome executable found.' }
              $screen = Join-Path $evidence 'first-screen-windows-node25-winfix2.png'
              $dom = Join-Path $evidence 'first-screen-windows-node25-winfix2.html'
              $profile = Join-Path $env:RUNNER_TEMP 'edge-winfix2-profile-final2'
              $profileDom = Join-Path $env:RUNNER_TEMP 'edge-winfix2-profile-dom-final2'
              & $browser '--headless=new' '--disable-gpu' '--no-sandbox' "--user-data-dir=$profile" '--window-size=1440,900' "--screenshot=$screen" "http://127.0.0.1:$port/"
              if ($LASTEXITCODE -ne 0) { throw "Browser screenshot failed: $LASTEXITCODE" }
              & $browser '--headless=new' '--disable-gpu' '--no-sandbox' "--user-data-dir=$profileDom" '--dump-dom' "http://127.0.0.1:$port/" | Set-Content -Encoding UTF8 $dom
              if ($LASTEXITCODE -ne 0) { throw "Browser DOM dump failed: $LASTEXITCODE" }
              $screenBytes = (Get-Item $screen).Length
              $domText = Get-Content $dom -Raw
              if ($screenBytes -lt 10000) { throw "Screenshot too small: $screenBytes" }
              if ($domText.Length -lt 1000 -or $domText -notmatch 'id="root"' -or $domText -match 'fatal-error') { throw 'Rendered first-screen DOM verification failed.' }
              $result.gates += [ordered]@{
                name = '07-dev-first-screen-browser'
                command = "npm.cmd run dev -- --host 127.0.0.1 --port $port; Edge/Chrome headless"
                exit_code = 0
                duration_seconds = [math]::Round(((Get-Date) - $devStarted).TotalSeconds, 3)
                port = $port
                browser = $browser
                http_status = $response.StatusCode
                screenshot_bytes = $screenBytes
                screenshot_sha256 = (Get-FileHash $screen -Algorithm SHA256).Hash.ToLowerInvariant()
                dom_bytes = (Get-Item $dom).Length
              }
            } finally {
              if ($dev -and -not $dev.HasExited) { & taskkill.exe /PID $dev.Id /T /F | Out-Null }
            }
          } finally { Pop-Location }

          $result.all_passed = @($result.gates | Where-Object { $_.exit_code -ne 0 }).Count -eq 0
          $result | ConvertTo-Json -Depth 10 | Set-Content -Encoding UTF8 (Join-Path $evidence 'windows-validation-winfix2.json')
          Copy-Item (Join-Path $project 'scripts\lib\module-specifier.mjs') (Join-Path $evidence 'module-specifier.mjs.txt')
          Copy-Item (Join-Path $project 'scripts\lib\load-typescript.mjs') (Join-Path $evidence 'load-typescript.mjs.txt')
          Copy-Item (Join-Path $project 'scripts\build.mjs') (Join-Path $evidence 'build.mjs.txt')
          Copy-Item (Join-Path $project 'scripts\typecheck.mjs') (Join-Path $evidence 'typecheck.mjs.txt')
          Copy-Item (Join-Path $project 'scripts\lint.mjs') (Join-Path $evidence 'lint.mjs.txt')
          Copy-Item (Join-Path $project 'scripts\serve.mjs') (Join-Path $evidence 'serve.mjs.txt')
          if (-not $result.all_passed) { throw 'Windows validation did not pass.' }

      - name: Upload immutable Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opusx-windows-node25-winfix2-final2-evidence
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30

      - name: Commit successful evidence to validation branch
        if: success()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $env:EVIDENCE_DIR
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Record final2 Windows Node 25.8.1 winfix2 gates'
          git push origin HEAD:ci/opusx-winfix2-node25-20260830
