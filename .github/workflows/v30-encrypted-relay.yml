name: v30 encrypted relay

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v30-encrypted-relay.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the already-encrypted aROP v30 capture
        shell: bash
        run: |
          set -Eeuo pipefail
          url='http://123.37.41.201:9000/.v30-transfer-58b00700313fdc6a4eec6d00.p7m'
          expected='58b00700313fdc6a4eec6d00238bbebcf72e5dc6ac8168bcb7f0a6b8bc0cb819'
          curl -fL --retry 5 --retry-delay 2 "$url" -o capture.tar.gz.p7m
          actual=$(sha256sum capture.tar.gz.p7m | awk '{print $1}')
          test "$actual" = "$expected"
          printf '%s  %s\n' "$actual" capture.tar.gz.p7m > capture.tar.gz.p7m.sha256
          stat -c '%n %s bytes' capture.tar.gz.p7m

      - name: Upload encrypted relay artifact
        uses: actions/upload-artifact@v4
        with:
          name: arop-v30-encrypted-capture
          path: |
            capture.tar.gz.p7m
            capture.tar.gz.p7m.sha256
          retention-days: 1
          if-no-files-found: error
