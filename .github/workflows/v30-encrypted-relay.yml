          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in capture.tar.gz -out capture.tar.gz.p7m recipient-cert.pem
          sha256sum capture.tar.gz.p7m > capture.tar.gz.p7m.sha256
          stat -c '%n %s bytes' capture.tar.gz.p7m

      - name: Upload encrypted relay artifact
        uses: actions/upload-artifact@v4
        with:
          name: arop-v30-encrypted-capture
          path: |
            capture.tar.gz.p7m
            capture.tar.gz.p7m.sha256
          retention-days: 1
          if-no-files-found: error
