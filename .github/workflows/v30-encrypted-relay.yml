# one-time encrypted relay for the active aROP v30 capture
name: v30 encrypted relay

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v30-encrypted-relay.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download capture bundle from the short-lived source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p payload/raw-main payload/raw-map payload/logs
          base='https://erp-rug-thumbnail-holds.trycloudflare.com'
          curl -fL --retry 5 --retry-delay 2 "$base/raw-main/main.webm" -o payload/raw-main/main.webm
          curl -fL --retry 5 --retry-delay 2 "$base/raw-map/map.webm" -o payload/raw-map/map.webm
          curl -fL --retry 5 --retry-delay 2 "$base/logs/record-main.log" -o payload/logs/record-main.log
          curl -fL --retry 5 --retry-delay 2 "$base/logs/record-map.log" -o payload/logs/record-map.log
          curl -fL --retry 5 --retry-delay 2 "$base/logs/spot-measure.log" -o payload/logs/spot-measure.log
          curl -fL --retry 5 --retry-delay 2 "$base/SHA256SUMS" -o payload/SHA256SUMS
          find payload -type f -printf '%P\t%s\n' | sort | tee payload/FILES.tsv
          test "$(stat -c%s payload/raw-main/main.webm)" -gt 10000000
          test "$(stat -c%s payload/raw-map/map.webm)" -gt 500000

