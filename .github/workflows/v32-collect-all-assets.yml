name: v32 collect all deployed assets

on:
  push:
    branches: ['gpt-pro/v32-direct-capture-relay']
    paths: ['.github/workflows/v32-collect-all-assets.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect bounded Vite asset graph
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, re, urllib.parse, urllib.request
          from collections import deque
          from pathlib import Path, PurePosixPath

          base='http://poonge.iptime.org:9200/'
          out=Path('site'); out.mkdir()
          exts=r'(?:js|css|svg|png|webp|jpg|jpeg|woff2?|ttf|otf|glb|gltf|bin|json|wasm)'
          abs_re=re.compile(rb'/?assets/[A-Za-z0-9_@.+~-]+\.'+exts.encode())
          rel_re=re.compile(rb'(?:\.\.?/)?[A-Za-z0-9_@.+~-]+\.'+exts.encode())
          q=deque(['index.html'])
          seen=set(); records=[]

          def normalize(raw, parent):
              s=raw.decode('utf-8','ignore').split('?',1)[0].split('#',1)[0]
              if s.startswith('/assets/') or s.startswith('assets/'):
                  return s.lstrip('/')
              if parent.startswith('assets/'):
                  return str(PurePosixPath(parent).parent.joinpath(s))
              return None

          while q and len(seen)<1200:
              rel=q.popleft()
              if rel in seen: continue
              seen.add(rel)
              url=urllib.parse.urljoin(base, rel)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'aROP-v32-asset-graph'})
                  with urllib.request.urlopen(req,timeout=75) as r:
                      data=r.read(); ctype=r.headers.get_content_type(); status=r.status
                  if rel!='index.html' and data.lstrip().lower().startswith(b'<!doctype html'):
                      records.append({'path':rel,'status':status,'error':'spa-fallback'})
                      continue
                  p=out/rel; p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
                  records.append({'path':rel,'status':status,'type':ctype,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
                  textual=ctype.startswith('text/') or rel.endswith(('.js','.css','.html','.json','.svg'))
                  if textual:
                      found=set(abs_re.findall(data))
                      if rel.startswith('assets/'):
                          found.update(rel_re.findall(data))
                      for raw in found:
                          child=normalize(raw,rel)
                          if child and child.startswith('assets/') and child not in seen:
                              q.append(child)
              except Exception as exc:
                  records.append({'path':rel,'error':repr(exc)})

          needles=[
            'map-camera-dock-notlive','NOT LIVE VIDEO','Sample Revision','event-feed-scope-note',
            '현재 선택한 사이트의 기록이 아닙니다','settings-showcase-toggle',
            'data-map-view-mode','STRUCTURAL_3D','WO-2026-0711-009','GRP-FNG-2026-0081'
          ]
          files=[p for p in out.rglob('*') if p.is_file()]
          scan={n:[str(p.relative_to(out)) for p in files if n.encode() in p.read_bytes()] for n in needles}
          meta={'base':base,'seenCount':len(seen),'downloadedCount':len(files),'records':records,'fingerprints':scan}
          Path('asset-graph.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('fingerprint-scan.json').write_text(json.dumps(scan,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'seen':len(seen),'downloaded':len(files),'fingerprints':scan},ensure_ascii=False,indent=2))
          PY
          tar -czf v32-all-assets.tar.gz site asset-graph.json fingerprint-scan.json
          sha256sum v32-all-assets.tar.gz > v32-all-assets.tar.gz.sha256
          du -sh site v32-all-assets.tar.gz
      - name: Upload complete deployed asset graph
        uses: actions/upload-artifact@v4
        with:
          name: v32-all-deployed-assets
          path: |
            v32-all-assets.tar.gz
            v32-all-assets.tar.gz.sha256
            asset-graph.json
            fingerprint-scan.json
          retention-days: 1
          if-no-files-found: error
