name: OPUS-X winfix2 secure Windows Node 25.8.1 validation v2

on:
  push:
    branches:
      - ci/opusx-winfix2-secure-20260830
    paths:
      - '.github/workflows/opusx-winfix2-secure-windows-v2.yml'

permissions:
  contents: write

jobs:
  windows-node25-secure-reopen-v2:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/opusx-winfix2-secure-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 25.8.1
      - name: Securely receive source and run Windows gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $branch = 'ci/opusx-winfix2-secure-20260830'
          $prefix = 'secure-exchange-v2'
          $exchange = Join-Path $env:GITHUB_WORKSPACE $prefix
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'windows-evidence-v2'
          Remove-Item $exchange,$evidence -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $exchange,$evidence | Out-Null

          function Pem([string]$label,[byte[]]$bytes) {
            $b64=[Convert]::ToBase64String($bytes); $lines=@()
            for($i=0;$i -lt $b64.Length;$i+=64){$lines += $b64.Substring($i,[Math]::Min(64,$b64.Length-$i))}
            "-----BEGIN $label-----`n$($lines -join "`n")`n-----END $label-----`n"
          }
          function RemoteText([string]$path) {
            $value=& git show "origin/${branch}:$path" 2>$null
            if($LASTEXITCODE -ne 0){throw "Cannot read $path"}
            (($value -join "`n").Trim())
          }

          $rsa=[Security.Cryptography.RSA]::Create(4096)
          $requestId=[Guid]::NewGuid().ToString('N')
          Set-Content (Join-Path $exchange 'public-key.pem') (Pem 'PUBLIC KEY' $rsa.ExportSubjectPublicKeyInfo()) -Encoding ascii -NoNewline
          [ordered]@{request_id=$requestId;run_id=$env:GITHUB_RUN_ID;node='v25.8.1';algorithm='RSA-OAEP-SHA256 + AES-256-GCM';created_utc=[DateTime]::UtcNow.ToString('o')} | ConvertTo-Json | Set-Content (Join-Path $exchange 'request.json') -Encoding utf8
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$prefix/public-key.pem" "$prefix/request.json"
          git commit -m "Publish OPUS-X winfix2 v2 one-time key $requestId"
          git push origin "HEAD:$branch"

          $manifest=$null
          for($i=0;$i -lt 240;$i++){
            git fetch origin $branch --quiet
            $raw=& git show "origin/${branch}:$prefix/manifest.json" 2>$null
            if($LASTEXITCODE -eq 0 -and $raw){try{$candidate=(($raw -join "`n")|ConvertFrom-Json);if($candidate.request_id -eq $requestId){$manifest=$candidate;break}}catch{}}
            Start-Sleep -Seconds 5
          }
          if(-not $manifest){throw "Timed out waiting for encrypted payload $requestId"}

          $wrapped=[Convert]::FromBase64String((RemoteText "$prefix/wrapped-key.b64"))
          $nonce=[Convert]::FromBase64String((RemoteText "$prefix/nonce.b64"))
          $tag=[Convert]::FromBase64String((RemoteText "$prefix/tag.b64"))
          $payloadB64=''; foreach($chunk in $manifest.chunks){$payloadB64 += RemoteText "$prefix/$chunk"}
          $cipher=[Convert]::FromBase64String($payloadB64)
          $key=$rsa.Decrypt($wrapped,[Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
          $plain=New-Object byte[] $cipher.Length
          $aes=[Security.Cryptography.AesGcm]::new($key,$tag.Length)
          try{$aes.Decrypt($nonce,$cipher,$tag,$plain,[Text.Encoding]::UTF8.GetBytes([string]$manifest.aad))}finally{$aes.Dispose();[Array]::Clear($key,0,$key.Length)}
          $payloadHash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($plain)).ToLowerInvariant()
          if($payloadHash -ne [string]$manifest.plaintext_sha256 -or $plain.Length -ne [int64]$manifest.plaintext_bytes){throw 'Decrypted payload integrity mismatch'}

          $archive=Join-Path $env:RUNNER_TEMP 'opusx-winfix2-v2.tar.xz'; [IO.File]::WriteAllBytes($archive,$plain)
          $unpacked=Join-Path $env:RUNNER_TEMP 'opusx-winfix2-v2-unpacked'; Remove-Item $unpacked -Recurse -Force -ErrorAction SilentlyContinue; New-Item -ItemType Directory -Force $unpacked|Out-Null
          & tar.exe -xf $archive -C $unpacked; if($LASTEXITCODE -ne 0){throw "tar failed $LASTEXITCODE"}
          $packageFile=Get-ChildItem $unpacked -Recurse -Filter package.json|Where-Object{$_.FullName -notmatch '[\\/]node_modules[\\/]'}|Sort-Object{$_.FullName.Length}|Select-Object -First 1
          if(-not $packageFile){throw 'No project package.json'}
          $project=$packageFile.Directory.FullName

          # The final ZIP retains the recovered TypeScript 5.8.3 vendor tree. The encrypted relay omits only that public package to keep source ciphertext small; restore the exact public package before validation.
          $tsStage=Join-Path $env:RUNNER_TEMP 'typescript-5.8.3-stage'; Remove-Item $tsStage -Recurse -Force -ErrorAction SilentlyContinue; New-Item -ItemType Directory -Force $tsStage|Out-Null
          Push-Location $tsStage
          try{
            $tgz=(& npm.cmd pack typescript@5.8.3 --silent).Trim(); if($LASTEXITCODE -ne 0 -or -not $tgz){throw 'npm pack typescript@5.8.3 failed'}
            $tgzPath=Join-Path $tsStage $tgz; $tsHash=(Get-FileHash $tgzPath -Algorithm SHA256).Hash.ToLowerInvariant()
            & tar.exe -xzf $tgzPath; if($LASTEXITCODE -ne 0){throw 'TypeScript package extraction failed'}
          }finally{Pop-Location}
          New-Item -ItemType Directory -Force (Join-Path $project 'vendor')|Out-Null
          Move-Item (Join-Path $tsStage 'package') (Join-Path $project 'vendor\typescript')
          $tsVersion=(Get-Content (Join-Path $project 'vendor\typescript\package.json') -Raw|ConvertFrom-Json).version
          if($tsVersion -ne '5.8.3' -or -not (Test-Path (Join-Path $project 'vendor\typescript\lib\typescript.js'))){throw 'TypeScript 5.8.3 vendor restoration failed'}

          $externalParent=Join-Path $env:RUNNER_TEMP 'Fresh Windows Folder With Spaces'; $external=Join-Path $externalParent 'OPUS X TX360 winfix2 Node 25.8.1'
          Remove-Item $externalParent -Recurse -Force -ErrorAction SilentlyContinue; New-Item -ItemType Directory -Force $external|Out-Null
          & robocopy.exe $project $external /MIR /XD node_modules dist dist-lib .git /NFL /NDL /NJH /NJS /NP|Out-Null; if($LASTEXITCODE -ge 8){throw "robocopy failed $LASTEXITCODE"}

          $result=[ordered]@{request_id=$requestId;node=(& node.exe --version).Trim();npm=(& npm.cmd --version).Trim();runner_os=$env:RUNNER_OS;image_os=$env:ImageOS;external_folder=$external;payload_sha256=$payloadHash;payload_bytes=$plain.Length;typescript_version=$tsVersion;typescript_tgz_sha256=$tsHash;workflow_run_id=$env:GITHUB_RUN_ID;gates=@()}
          if($result.node -ne 'v25.8.1'){throw "Unexpected Node $($result.node)"}
          function Gate([string]$name,[string]$command){$log=Join-Path $evidence ($name+'.log');$start=Get-Date;& cmd.exe /d /s /c $command 2>&1|Tee-Object -FilePath $log;$exit=$LASTEXITCODE;$result.gates += [ordered]@{name=$name;command=$command;exit_code=$exit;duration_seconds=[Math]::Round(((Get-Date)-$start).TotalSeconds,3);log=[IO.Path]::GetFileName($log)};if($exit -ne 0){throw "$name failed $exit"}}

          Push-Location $external
          try{
            Gate '01-ci' 'npm.cmd ci --no-audit --no-fund'
            Gate '02-windows-esm-contract' 'npm.cmd run check:windows-esm'
            Gate '03-typecheck' 'npm.cmd run typecheck'
            Gate '04-lint' 'npm.cmd run lint'
            Gate '05-test' 'npm.cmd run test'
            Gate '06-build' 'npm.cmd run build'
            $listener=[Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback,0);$listener.Start();$port=$listener.LocalEndpoint.Port;$listener.Stop()
            $stdout=Join-Path $evidence '07-dev.stdout.log';$stderr=Join-Path $evidence '07-dev.stderr.log';$start=Get-Date
            $dev=Start-Process cmd.exe -ArgumentList @('/d','/s','/c',"npm.cmd run dev -- --host 127.0.0.1 --port $port") -WorkingDirectory $external -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            try{
              $response=$null;for($i=0;$i -lt 180;$i++){Start-Sleep -Milliseconds 500;try{$response=Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/" -TimeoutSec 2;if($response.StatusCode -eq 200 -and $response.Content -match 'id="root"'){break}}catch{$response=$null};if($dev.HasExited){break}}
              if(-not $response -or $response.StatusCode -ne 200){throw 'Dev server HTTP verification failed'}
              $browser=@("$env:ProgramFiles(x86)\Microsoft\Edge\Application\msedge.exe","$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe","$env:ProgramFiles\Google\Chrome\Application\chrome.exe","$env:ProgramFiles(x86)\Google\Chrome\Application\chrome.exe")|Where-Object{Test-Path $_}|Select-Object -First 1
              if(-not $browser){throw 'No Edge/Chrome'}
              $screen=Join-Path $evidence 'first-screen-windows-node25-winfix2.png';$dom=Join-Path $evidence 'first-screen-windows-node25-winfix2.html'
              & $browser '--headless=new' '--disable-gpu' '--no-sandbox' "--user-data-dir=$(Join-Path $env:RUNNER_TEMP 'edge-wf2-a')" '--window-size=1440,900' "--screenshot=$screen" "http://127.0.0.1:$port/";if($LASTEXITCODE -ne 0){throw 'Browser screenshot failed'}
              & $browser '--headless=new' '--disable-gpu' '--no-sandbox' "--user-data-dir=$(Join-Path $env:RUNNER_TEMP 'edge-wf2-b')" '--dump-dom' "http://127.0.0.1:$port/"|Set-Content $dom -Encoding utf8;if($LASTEXITCODE -ne 0){throw 'Browser DOM failed'}
              $domText=Get-Content $dom -Raw;$screenBytes=(Get-Item $screen).Length;if($screenBytes -lt 10000 -or $domText.Length -lt 1000 -or $domText -notmatch 'id="root"' -or $domText -match 'fatal-error'){throw 'First-screen render assertions failed'}
              $result.gates += [ordered]@{name='07-dev-first-screen-browser';command="npm.cmd run dev -- --host 127.0.0.1 --port $port; Edge/Chrome";exit_code=0;duration_seconds=[Math]::Round(((Get-Date)-$start).TotalSeconds,3);port=$port;browser=$browser;http_status=$response.StatusCode;screenshot_bytes=$screenBytes;screenshot_sha256=(Get-FileHash $screen -Algorithm SHA256).Hash.ToLowerInvariant();dom_bytes=(Get-Item $dom).Length}
            }finally{if($dev -and -not $dev.HasExited){& taskkill.exe /PID $dev.Id /T /F|Out-Null}}
          }finally{Pop-Location}
          $result.all_passed=@($result.gates|Where-Object{$_.exit_code -ne 0}).Count -eq 0
          $result|ConvertTo-Json -Depth 10|Set-Content (Join-Path $evidence 'windows-validation-winfix2.json') -Encoding utf8
          Copy-Item (Join-Path $external 'scripts\import-utils.mjs') (Join-Path $evidence 'import-utils.mjs.txt');Copy-Item (Join-Path $external 'scripts\common.mjs') (Join-Path $evidence 'common.mjs.txt');Copy-Item (Join-Path $external 'scripts\build.mjs') (Join-Path $evidence 'build.mjs.txt');Copy-Item (Join-Path $external 'scripts\typecheck.mjs') (Join-Path $evidence 'typecheck.mjs.txt');Copy-Item (Join-Path $external 'scripts\lint.mjs') (Join-Path $evidence 'lint.mjs.txt')
          if(-not $result.all_passed){throw 'Windows validation did not pass'}
      - name: Upload immutable Windows v2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opusx-winfix2-windows-node25-evidence-v2
          path: windows-evidence-v2
          if-no-files-found: warn
          retention-days: 30
